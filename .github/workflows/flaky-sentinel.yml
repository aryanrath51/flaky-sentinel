name: Flaky Sentinel Triage

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run (sample or regression)"
        required: true
        default: "sample"
        type: choice
        options:
          - sample
          - regression
  workflow_run:
    workflows: ["CI Tests"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  triage:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest

      - name: Train model & run triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.main train
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            python -m src.main triage-run --repo "${{ github.repository }}" --run-id "${{ github.event.workflow_run.id }}"
          else
            python -m src.main "${{ github.event.inputs.scenario || 'sample' }}"
          fi

      - name: Comment triage report on Pull Request
        if: github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0] != null
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prs = context.payload.workflow_run?.pull_requests || [];
            if (prs.length === 0) {
              console.log('No associated pull request found for this workflow_run.');
              return;
            }
            const body = fs.readFileSync('data/processed/pr_comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prs[0].number,
              body
            });

      - name: Upload model & quarantine ledger
        uses: actions/upload-artifact@v4
        with:
          name: flaky-sentinel-artifacts-${{ github.run_id }}
          path: data/processed/