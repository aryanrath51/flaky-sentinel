name: Flaky Sentinel Triage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run (sample or regression)"
        required: true
        default: "sample"
        type: choice
        options:
          - sample
          - regression

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest

      - name: Train model & run scenario
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.main train
          python -m src.main ${{ github.event.inputs.scenario || 'sample' }}

      - name: Upload model & quarantine ledger
        uses: actions/upload-artifact@v4
        with:
          name: flaky-sentinel-artifacts-${{ github.run_id }}
          path: data/processed/