name: Flaky Sentinel Triage

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run (sample or regression)"
        required: true
        default: "sample"
        type: choice
        options:
          - sample
          - regression
  workflow_run:
    workflows: ["CI Tests"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  triage:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest

      - name: Train model & run triage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.main train
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            python -m src.main triage-run --repo "${{ github.repository }}" --run-id "${{ github.event.workflow_run.id }}"
          else
            python -m src.main "${{ github.event.inputs.scenario || 'sample' }}"
          fi

      - name: Comment triage report on Pull Request
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const wfRun = context.payload.workflow_run;
            let prNumber = wfRun?.pull_requests?.[0]?.number;

            if (!prNumber && wfRun?.head_branch) {
              const pulls = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${wfRun.head_branch}`,
                state: 'open',
              });
              prNumber = pulls.data[0]?.number;
            }

            if (!prNumber) {
              console.log('No open pull request found for workflow_run branch:', wfRun?.head_branch);
              return;
            }

            const marker = '<!-- flaky-sentinel-triage-report -->';
            const reportBody = fs.readFileSync('data/processed/pr_comment.md', 'utf8');
            const body = `${marker}\n${reportBody}`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.data.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Upload model & quarantine ledger
        uses: actions/upload-artifact@v4
        with:
          name: flaky-sentinel-artifacts-${{ github.run_id }}
          path: data/processed/